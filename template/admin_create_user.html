{% extends "base.html" %}

{% block title %}Create user{% endblock %}

{% block content %}
<main class="container py-5">
  <div class="mb-4">
    <p class="text-uppercase text-secondary small mb-1">Administration</p>
    <h1 class="fw-bold">Create a user</h1>
    <p class="text-secondary">
      Create a customer account or grant administrator access for the lab.
    </p>
  </div>

  <form method="post" class="card card-body bg-light border-0"
        style="max-width: 30rem;">
    <label class="form-label" for="username">Username</label>
    <input class="form-control mb-3" type="text" name="username"
           id="username" required>

    <label class="form-label" for="password">Password</label>
    <input class="form-control mb-3" type="password" name="password"
           id="password" required>

    <label class="form-label" for="role">Role</label>
    <select class="form-select mb-3" name="role" id="role" required>
      <option value="customer">Customer</option>
      <option value="admin">Administrator</option>
    </select>

    <button class="btn btn-dark align-self-start" type="submit">
      Create user
    </button>
  </form>
</main>
{% endblock %}
