<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}{% endblock %} - Home-Lab</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
        Home-Lab
      </a>

      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-light" href="#cart">
          Cart <span class="badge text-bg-light">0</span>
        </a>

        {% if session.get("username") %}
          <span class="text-white ms-2">
            Welcome, {{ session["username"] }}
          </span>

          <a class="btn btn-outline-light" href="{{ url_for('admin') }}">
            Admin
          </a>

          <a class="btn btn-danger" href="{{ url_for('logout') }}">
            Log Out
          </a>
        {% else %}
          <a class="btn btn-outline-light" href="{{ url_for('register') }}">
            Register
          </a>

          <a class="btn btn-light" href="{{ url_for('login') }}">
            Log In
          </a>
        {% endif %}
      </div>
    </div>
  </nav>

  <section class="content">
    <header>
      {% block header %}{% endblock %}
    </header>

    {% for message in get_flashed_messages() %}
      <div class="container mt-3">
        <div class="alert alert-warning">
          {{ message }}
        </div>
      </div>
    {% endfor %}

    {% block content %}{% endblock %}
  </section>
</body>
</html>
