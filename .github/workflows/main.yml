name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

# NOTE: this is a deliberately vulnerable training app, so every scanner runs in
# report-only mode (continue-on-error). On a real project, remove
# `continue-on-error` so critical findings fail the pipeline.

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt semgrep

      - name: Run Bandit (HTML report)
        run: bandit app.py db.py -f html -o bandit-report.html
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.html

      # The vulnerable source files are scanned too, so the findings appear in the log.
      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/owasp-top-ten
          --config p/security-audit
          --config p/secrets
          --exclude .git
          --exclude instance
          --exclude reports
        continue-on-error: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the full git history, not only the last commit

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # the lab intentionally contains a hardcoded key

  sca:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Home-Lab'
          path: '.'
          format: 'HTML'
          args: >
            --enableExperimental
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/